[pytest]
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.sql.schema
testpaths = tests
python_files =
    test_closing_methods_behavior.py
    test_channel_output_behavior.py
    test_channel_semantics.py
    test_pipeline_integrity.py
    test_conversation_state.py
    test_conversation_state_effect.py
    test_response_guard.py
    test_sales_closing_strength.py
    test_multi_tenant_no_hardcode.py
    test_multi_model_behavior.py
    test_multi_model_strictness.py
    test_memory_sales_usage.py
    test_sales_pressure.py
    test_sales_behavior.py
    test_memory_repository_contract.py
    test_initial_flow_and_tenant_isolation.py
    test_initial_message_redesign.py
    test_conversation_context_continuity.py
    test_runtime_structure_integrity.py
    test_memory_context_persistence.py
    test_commercial_behavior.py
    test_real_conversation_flow.py
    test_catalog_behavior.py
    test_response_structure.py
    test_saas_guards.py
    test_v1_gate.py
addopts = -q
norecursedirs = .venv .pytest_cache project/scripts scripts
markers =
    unit: pruebas unitarias puras
    integration: pruebas de integración entre capas
    e2e: pruebas extremo a extremo representativas