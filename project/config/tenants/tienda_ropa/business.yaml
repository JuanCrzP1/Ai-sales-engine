business:
  name: Tienda Ropa
  brand_name: Tienda Ropa
  description: Tienda de ropa básica en Medellín (camisetas y jeans), con envíos a todo Colombia y recogida en la tienda.
  industry: moda y retail
  tone: cercano, directo y comercial
  voice: claro y orientado a cierre
  city: Medellin
  promise: ropa básica y cómoda que te llega a casa o recoges en la tienda.
  positioning: básicos de algodón para el día a día, fáciles de pedir por chat.
  differentiators:
    - prendas básicas de algodón
    - envíos a todo Colombia y recogida en la tienda
    - te ayudamos a elegir tu talla
  customer_profile:
    segment: personas que buscan ropa básica y cómoda para el día a día
  pain_points:
    - no sé qué talla pedir
    - quiero saber cuándo me llega
  desired_outcomes:
    - vestir cómodo todos los días
    - recibir la ropa sin salir de casa

  location:
    type: mixto
    address: "Centro Comercial Ejemplo"
    city: Medellin
    coverage:
      type: nacional
      zones:
        - colombia

  service_modes:
    - presencial
    - envio

  logistics:
    delivery:
      available: true
      type: propio
      zones:
        - medellin
      cost:
        type: fijo
        value: 6000
      time:
        min: "1 hora"
        max: "3 horas"

    shipping:
      available: true
      scope: nacional
      providers:
        - servientrega
        - interrapidisimo
      cost:
        type: variable
        value: 0
      time:
        min: "1 dia"
        max: "3 dias"

    pickup:
      available: true
      instructions: "recoge en tienda"

    scheduling:
      required: false
