business:
  name: Viajes Demo
  brand_name: Viajes Demo
  description: >
    Agencia de viajes en Medellín que arma paquetes por Colombia con vuelo y hotel incluidos,
    y tours de un día desde la ciudad.
  industry: agencia de viajes y turismo
  tone: humano, claro y consultivo
  voice: cercano, directo y orientado a cierres
  city: Medellin
  promise: >
    Viajes organizados de principio a fin para que solo te preocupes por disfrutar.
  positioning: >
    Paquetes de viaje listos por Colombia, cotizados y reservados por chat.
  differentiators:
    - paquetes con vuelo y hotel incluidos
    - asesoría personalizada por chat
    - financiación con Addi y Sistecrédito
    - tours de un día desde Medellín
  customer_profile:
    segment: personas, parejas y familias que quieren viajar por Colombia
    maturity: llegan con un destino o unas fechas en mente y quieren saber el precio y qué incluye
    roles:
      - el viajero
      - quien organiza el viaje del grupo
  pain_points:
    - no sé qué destino me alcanza con mi presupuesto
    - no quiero preocuparme por organizar todo
    - necesito saber qué incluye antes de reservar
    - quiero viajar en unas fechas específicas
  desired_outcomes:
    - viajar sin preocuparse por la logística
    - saber desde el principio qué incluye y cuánto cuesta
    - pagar con facilidad, también a cuotas
    - aprovechar sus días de descanso
  credibility:
    - viajeros que vuelven a reservar con nosotros
    - acompañamiento antes y durante el viaje
  value_drivers:
    tiempo:
      description: no tener que organizar vuelo y hotel por su cuenta
      triggers:
        - "no tengo tiempo de organizar"
        - "quiero algo listo"
    dinero:
      description: saber exactamente cuánto cuesta el viaje y poder pagarlo a cuotas
      triggers:
        - "cuánto me sale todo"
        - "se puede a cuotas"
  buying_motivation:
    primary: dinero
    secondary: tiempo
  use_cases:
    - nombre: escapada corta
      senales:
        - "un fin de semana"
        - "algo cerca"
      enfoque: ofrecer el tour de un día a Guatapé
    - nombre: vacaciones en familia
      senales:
        - "vamos con los niños"
        - "somos cuatro"
      enfoque: recomendar Cartagena o San Andrés según sus fechas

  location:
    type: virtual
    address: ""
    city: Medellin
    coverage:
      type: internacional
      zones:
        - colombia
        - internacional

  service_modes:
    - virtual

  logistics:
    delivery:
      available: false
      type: tercero
      zones: []
      cost:
        type: variable
        value: 0
      time:
        min: ""
        max: ""

    shipping:
      available: false
      scope: internacional
      providers: []
      cost:
        type: variable
        value: 0
      time:
        min: ""
        max: ""

    pickup:
      available: false
      instructions: ""

    scheduling:
      required: true
