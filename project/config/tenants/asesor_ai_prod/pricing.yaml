pricing:
  plans:  # Lista de planes o paquetes disponibles
    - id: plan_basico  # Identificador interno del plan
      name: Plan Basico  # Nombre visible del plan
      description: Configuracion inicial + sistema mensual

      pricing:  # Precios por moneda
        COP:
          implementation: 150000  # Cobro inicial de implementacion o arranque
          monthly: 180000  # Cobro mensual recurrente

        USD:
          implementation: 40  # Cobro inicial de implementacion o arranque
          monthly: 45  # Cobro mensual recurrente

      includes:  # Lo que si trae este plan
        - configuracion inicial
        - Integración con WhatsApp
        - Asistente conversacional inteligente
        - Soporte inicial
        - Seguimiento automático de clientes

      not_included:  # Lo que no esta incluido en este plan
        - Costos de Meta (WhatsApp Business API)
        - costos de plataformas externas 
        - inversion publicitaria
        - Desarrollos o integraciones avanzadas

      payment:
        # ------------------------------
        # EJECUCIÓN DE PAGO
        # ------------------------------
        # Define cómo el cliente paga.
        # Este link es el que la IA puede enviar si decide cerrar.
        link: "https://checkout.aisalesengine.com/asesor-ai-prod/plan-basico"
        transfer:
          enabled: true
          methods:
            - type: nequi
              number: "3001234567"
            - type: daviplata
              number: "3009876543"
            - type: bank
              bank: "Bancolombia"
              account_type: "ahorros"
              account_number: "1234567890"
            - type: breb
              reference: "usuario@correo.com"

  conditions:  # Reglas comerciales que se deben respetar
    - sin permanencia obligatoria
    - se puede cancelar mensual
    - el primer mes se paga 330000 COP (configuracion + primer mes)
    - luego se paga mensualmente 180000 COP

  price_framing:
    type: comparativo  # Forma de presentar el precio: directo | comparativo

  roi:  # Referencia simple para medir retorno esperado
    break_even_sales: 3

  business_offers:  # Mapa simple de oferta principal, upsell y cross-sell
    core:  # Oferta principal que mas se vende
      - plan_basico
      - plan_pro
    upsell:  # Oferta para subir valor de la venta
      - plan_pro
      - prioridad_soporte
    cross_sell:  # Oferta complementaria que suma al cierre
      - integraciones
      - setup_operativo
    financing:
      available: false  # true = permite financiacion / false = no ofrece financiacion
      providers: []
      options: []

