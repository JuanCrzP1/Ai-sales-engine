name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Suite unitaria: corre en modo test (sqlite in-memory), sin Postgres ni .env.
      MODE: test
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            project/requirements.txt
            project/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements-dev.txt
      - name: Run unit tests
        run: |
          # Sin OPENROUTER_API_KEY los tests de integración se autoexcluyen (skip).
          pytest -q

  panel:
    # Panel de administración: tipos, pruebas con backend en memoria e integración contra la API real (SQLite temporal).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python (API real para la integración)
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: project/requirements.txt
      - name: Install API dependencies
        run: pip install -r ../../project/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/admin-web/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install panel dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (panel + API + SQLite)
        env:
          ADMIN_API_PYTHON: python
        run: npm run test:integration
      - name: Build
        run: npm run build

  memory:
    # La memoria del motor contra un PostgreSQL de verdad (tests/test_memory_postgres.py): lo que recuerda de cada cliente entre
    # mensajes y entre servidores. Sin esta base, la suite unitaria las salta.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: memoria
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODE: test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:pruebas@localhost:5432/memoria
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            project/requirements.txt
            project/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements-dev.txt
      - name: Run memory tests (PostgreSQL)
        run: pytest -q tests/test_memory_postgres.py

  integration:
    needs: test
    runs-on: ubuntu-latest
    env:
      MODE: test
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Guard - requiere OPENROUTER_API_KEY
        id: guard
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sin secreto OPENROUTER_API_KEY: se omite la suite de integración."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            project/requirements.txt
            project/requirements-dev.txt
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r project/requirements-dev.txt
      - name: Run integration tests (LLM en vivo)
        if: steps.guard.outputs.run == 'true'
        run: |
          pytest -q -m integration

  build:
    needs: [test, panel, memory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute lowercase image name
        id: image
        run: |
          # GHCR (OCI) exige nombres en minúsculas; github.repository preserva el
          # casing original (p. ej. JuanCrzP1/Ai-sales-engine). Normalizamos aquí.
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/${{ steps.image.outputs.name }}:latest
